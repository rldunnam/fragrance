name: Build and Publish Container

# Tagging model:
#   every push to main   -> :test and :test-<sha>
#   manual release run   -> the above, plus :latest
#   pull requests        -> build only, nothing is pushed to GHCR
#
# :latest is deliberately opt-in. main is pushed to directly, so an automatic
# :latest would mean every commit is a release. Cutting one is a conscious act:
# Actions -> this workflow -> Run workflow -> tick "release".

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release:
        description: "Also tag this build as :latest"
        type: boolean
        default: false

# Deny by default; each job opts into exactly what it needs.
permissions: {}

# Two pushes in quick succession would otherwise race to write the same tags,
# and the loser can finish last. PR runs are cancelled on new commits since
# only the latest one matters; main runs are not, because they publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # Filesystem scan
  # ===========================================================================
  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table
          trivyignores: .trivyignore
          scanners: vuln,config
          skip-dirs: .next,node_modules,.pnpm-store
          # Do not fail the build on vulnerabilities that have no patch
          # available. They are unactionable, and blocking on them means an
          # unrelated disclosure can stop you shipping.
          ignore-unfixed: true

  # ===========================================================================
  # Build (one job per architecture)
  # ===========================================================================
  build:
    needs: trivy-fs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform slug
        id: slug
        run: echo "slug=$(echo ${{ matrix.platform }} | tr '/' '-')" >> $GITHUB_OUTPUT

      # --- pull requests: build only, never push -------------------------------
      # Dependabot-triggered runs get a read-only token and cannot write to
      # GHCR at all, so PRs verify that the image builds on both architectures
      # and stop there.
      #
      # NOTE: the NEXT_PUBLIC_* build args must ALSO exist as Dependabot secrets
      # (Settings -> Secrets and variables -> Dependabot), or Dependabot PRs
      # will fail during `next build` with a missing Clerk publishableKey.
      - name: Build (pull request, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          cache-from: type=gha,scope=${{ matrix.platform }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}-${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # --- main / dispatch: push by digest -------------------------------------
      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.platform }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}-${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ steps.slug.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  # Image scan
  # ===========================================================================
  trivy-image:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download amd64 digest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: digest-linux-amd64
          path: /tmp/digests

      - name: Resolve digest
        id: digest
        run: |
          file="$(ls /tmp/digests)"
          if [ -z "$file" ]; then
            echo "No digest file found" >&2
            exit 1
          fi
          echo "sha=sha256:${file}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.digest.outputs.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table
          trivyignores: .trivyignore
          ignore-unfixed: true

  # ===========================================================================
  # Smoke test
  # ===========================================================================
  smoke-test:
    runs-on: ubuntu-latest
    needs: [ trivy-image ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: digest-linux-amd64
          path: /tmp/digests

      - name: Resolve digest
        id: digest
        run: |
          file="$(ls /tmp/digests)"
          if [ -z "$file" ]; then
            echo "No digest file found" >&2
            exit 1
          fi
          echo "sha=sha256:${file}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start container
        run: |
          docker run -d --name smoke \
            -p 3000:3000 \
            ghcr.io/${{ github.repository }}@${{ steps.digest.outputs.sha }}

      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to start..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App did not respond within 15s"
          docker logs smoke
          exit 1

      # / alone never exercises the Supabase or Clerk client code. /collection
      # and /quiz both mount CollectionProvider consumers, so a build with
      # missing NEXT_PUBLIC_* values fails here instead of in production.
      - name: Verify routes return 200
        run: |
          FAILED=0
          for path in / /collection /quiz /guide; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" "http://localhost:3000${path}")
            if [ "$STATUS" = "200" ]; then
              echo "OK   ${path} -> ${STATUS}"
            else
              echo "FAIL ${path} -> ${STATUS}"
              FAILED=1
            fi
          done
          if [ "$FAILED" != "0" ]; then
            echo "--- container logs ---"
            docker logs smoke
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker rm -f smoke || true

  # ===========================================================================
  # Manifest merge and tagging
  # ===========================================================================
  merge:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        env:
          REPO: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
          RELEASE: ${{ inputs.release }}
        run: |
          [ "$(ls -A .)" ] || { echo "No digests found, aborting."; exit 1; }

          TAGS=( --tag "${REPO}:test" --tag "${REPO}:test-${SHA}" )

          if [ "${RELEASE}" = "true" ]; then
            echo "Release run: also tagging :latest"
            TAGS+=( --tag "${REPO}:latest" )
          else
            echo "Not a release run: :latest will not be moved"
          fi

          docker buildx imagetools create \
            "${TAGS[@]}" \
            $(printf "${REPO}@sha256:%s " *)

          echo "### Published tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "${TAGS[@]}" | grep -o "${REPO}:.*" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Registry cleanup
  # ===========================================================================
  cleanup:
    runs-on: ubuntu-latest
    needs: merge
    if: github.event_name != 'pull_request'
    permissions:
      packages: write

    steps:
      - name: Delete old untagged image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
