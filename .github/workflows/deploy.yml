name: Build and Publish Container

# Tagging model:
#   every push to main   -> :test and :test-<sha>
#   manual release run   -> the above, plus :latest
#   pull requests        -> build only, nothing is pushed to GHCR
#
# :latest is deliberately opt-in. main is pushed to directly, so an automatic
# :latest would mean every commit is a release. Cutting one is a conscious act:
# Actions -> this workflow -> Run workflow -> tick "release".

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release:
        description: "Also tag this build as :latest"
        type: boolean
        default: false

# Deny by default; each job opts into exactly what it needs.
permissions: {}

# Two pushes in quick succession would otherwise race to write the same tags,
# and the loser can finish last. PR runs are cancelled on new commits since
# only the latest one matters; main runs are not, because they publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # Change detection
  # ===========================================================================
  # Decides whether this run can affect the container image. Commits that only
  # touch docs/, root *.md, the devcontainer, or repo-admin files under .github/
  # skip the scan/build/publish chain; lint still runs because `pnpm validate`
  # reads docs/validation-findings.md (the ledger), so a ledger edit is still
  # checked.
  #
  # Done with plain git rather than a paths-filter action to avoid another
  # third-party dependency in a job that gates publishing. Anything the script
  # cannot classify with certainty (manual runs, first push of a branch, a
  # force-push whose old head is gone, an empty diff) defaults to building.
  #
  # Job-level `if:` is used instead of workflow-level `paths-ignore` so a
  # skipped job reports as "Skipped" (which satisfies required status checks)
  # rather than never reporting and leaving a PR blocked on "Expected".
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          build() { echo "image=true" >> "$GITHUB_OUTPUT"; echo "image: true ($1)"; exit 0; }

          case "$EVENT" in
            # PRs check out the merge commit; its first parent is current main,
            # so this is exactly what the PR would change.
            pull_request) BASE="HEAD^1" ;;
            push)
              [[ "$BEFORE" =~ ^0+$ ]] && build "no previous head"
              git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || build "previous head not in history"
              BASE="$BEFORE" ;;
            *) build "event ${EVENT}" ;;
          esac

          changed="$(git diff --name-only "$BASE" "$SHA")"
          [ -n "$changed" ] || build "empty diff"
          echo "Changed files:"; sed 's/^/  /' <<< "$changed"

          # Paths that never reach the image. Keep in step with .dockerignore.
          relevant="$(printf '%s\n' "$changed" | grep -vE \
            '^(docs/|\.devcontainer/|[^/]+\.md$|\.github/(dependabot\.yml|CODEOWNERS|workflows/refresh-lockfile\.yml)$)' \
            || true)"

          if [ -n "$relevant" ]; then
            build "image-relevant changes present"
          fi
          echo "image=false" >> "$GITHUB_OUTPUT"
          echo "image: false (docs/admin-only change; skipping scan, build and publish)"
          echo "Docs/admin-only change: image build and publish skipped." >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Lint and typecheck
  # ===========================================================================
  # Runs in parallel with trivy-fs; build waits on both. Fails in well under a
  # minute, so a typo does not cost a ten-minute two-architecture Docker build.
  #
  # tsc --noEmit is included even though `next build` typechecks: the build only
  # runs inside Docker, so without this a type error surfaces at the end of the
  # slowest job instead of the start of the fastest one.
  #
  # No secrets are used here, which is what lets it work unchanged on Dependabot
  # pull requests (those run with a read-only token and no Actions secrets).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 to match the Dockerfile and the devcontainer. pnpm 11 requires
      # the node:sqlite builtin, which does not exist before Node 22.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # corepack resolves pnpm from the packageManager field in package.json,
      # so CI uses exactly the version the lockfile was written with.
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      # Catalog invariants TypeScript cannot express: family/occasion/season are
      # typed string[], so an unknown value compiles fine while making the entry
      # unreachable by filtering.
      - name: Validate fragrance catalog
        run: pnpm validate

      # public/ is served verbatim at the site root and copied into the image,
      # so a file nobody reads still reaches production. Catches dynamic code
      # execution and scaffolding leftovers.
      - name: Check public assets
        run: pnpm check:public

  # ===========================================================================
  # Filesystem scan
  # ===========================================================================
  trivy-fs:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table
          trivyignores: .trivyignore.yaml
          scanners: vuln,config
          skip-dirs: .next,node_modules,.pnpm-store
          # Do not fail the build on vulnerabilities that have no patch
          # available. They are unactionable, and blocking on them means an
          # unrelated disclosure can stop you shipping.
          ignore-unfixed: true

  # ===========================================================================
  # Build (one job per architecture)
  # ===========================================================================
  # Skipped when `changes` says the image cannot differ. trivy-image, smoke-test,
  # merge and cleanup all depend on this job and skip with it.
  build:
    needs: [ changes, lint, trivy-fs ]
    if: needs.changes.outputs.image == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform slug
        id: slug
        run: echo "slug=$(echo ${{ matrix.platform }} | tr '/' '-')" >> $GITHUB_OUTPUT

      # --- pull requests: build only, never push -------------------------------
      # Dependabot-triggered runs get a read-only token and cannot write to
      # GHCR at all, so PRs never push. Both architectures are built; the amd64
      # image is also loaded into the runner's Docker so it can be scanned and
      # smoke-tested below, catching runtime breakage before it reaches main.
      #
      # NOTE: the NEXT_PUBLIC_* build args must ALSO exist as Dependabot secrets
      # (Settings -> Secrets and variables -> Dependabot), or Dependabot PRs
      # will fail during `next build` with a missing Clerk publishableKey.
      - name: Build (pull request, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.platform == 'linux/amd64' }}
          tags: fragrance:pr
          provenance: false
          cache-from: type=gha,scope=${{ matrix.platform }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}-${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Same scan settings as the trivy-image job, run against the local image.
      - name: Run Trivy image scan (pull request)
        if: github.event_name == 'pull_request' && matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: fragrance:pr
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table
          trivyignores: .trivyignore.yaml
          ignore-unfixed: true

      - name: Smoke test (pull request)
        if: github.event_name == 'pull_request' && matrix.platform == 'linux/amd64'
        run: bash scripts/smoke-test.sh fragrance:pr

      # --- main / dispatch: push by digest -------------------------------------
      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.platform }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}-${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ steps.slug.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ===========================================================================
  # Build status (required check)
  # ===========================================================================
  # The branch ruleset requires this job instead of the two build legs. A
  # matrix job skipped at job level reports a single "build" check rather than
  # one per platform, so requiring the per-platform names would leave every
  # docs-only PR waiting forever. This job always runs and collapses the
  # matrix into one result: success or skipped passes, anything else fails.
  build-status:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check build result
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "build: ${RESULT}"
          case "$RESULT" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac

  # ===========================================================================
  # Image scan
  # ===========================================================================
  trivy-image:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-linux-amd64
          path: /tmp/digests

      - name: Resolve digest
        id: digest
        run: |
          file="$(ls /tmp/digests)"
          if [ -z "$file" ]; then
            echo "No digest file found" >&2
            exit 1
          fi
          echo "sha=sha256:${file}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.digest.outputs.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table
          trivyignores: .trivyignore.yaml
          ignore-unfixed: true

  # ===========================================================================
  # Smoke test
  # ===========================================================================
  smoke-test:
    runs-on: ubuntu-latest
    needs: [ trivy-image ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-linux-amd64
          path: /tmp/digests

      - name: Resolve digest
        id: digest
        run: |
          file="$(ls /tmp/digests)"
          if [ -z "$file" ]; then
            echo "No digest file found" >&2
            exit 1
          fi
          echo "sha=sha256:${file}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same script the pull request build runs; see scripts/smoke-test.sh.
      - name: Smoke test
        run: bash scripts/smoke-test.sh "ghcr.io/${{ github.repository }}@${{ steps.digest.outputs.sha }}"

  # ===========================================================================
  # Manifest merge and tagging
  # ===========================================================================
  merge:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        env:
          REPO: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
          RELEASE: ${{ inputs.release }}
        run: |
          [ "$(ls -A .)" ] || { echo "No digests found, aborting."; exit 1; }

          TAGS=( --tag "${REPO}:test" --tag "${REPO}:test-${SHA}" )

          if [ "${RELEASE}" = "true" ]; then
            echo "Release run: also tagging :latest"
            TAGS+=( --tag "${REPO}:latest" )
          else
            echo "Not a release run: :latest will not be moved"
          fi

          docker buildx imagetools create \
            "${TAGS[@]}" \
            $(printf "${REPO}@sha256:%s " *)

          echo "### Published tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "${TAGS[@]}" | grep -o "${REPO}:.*" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Registry cleanup
  # ===========================================================================
  cleanup:
    runs-on: ubuntu-latest
    needs: merge
    if: github.event_name != 'pull_request'
    permissions:
      packages: write

    steps:
      - name: Delete old untagged image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
