# Dependabot configuration for rldunnam/fragrance
#
# Four ecosystems are watched:
#   github-actions -> action refs in .github/workflows/
#   npm            -> package.json + pnpm-lock.yaml
#   devcontainers  -> Features in .devcontainer/devcontainer.json
#   docker         -> base images in the Dockerfile
#
# Two mechanisms keep PR volume manageable:
#
#   groups   bundle related bumps into one PR. Only minor and patch updates
#            are ever grouped; majors always arrive alone so each one gets a
#            real review and an isolated revert.
#   cooldown makes a release sit on the registry for N days before Dependabot
#            will open a PR for it. Compromised or broken releases are usually
#            caught within the first day or two, so this is the cheapest
#            supply-chain control available here. GitHub applies a 3-day
#            default; the windows below widen it, weighted by blast radius.
#            Cooldown never delays security updates.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  # Dependabot maintains SHA pins and keeps the trailing version comment in
  # sync, i.e. `uses: foo/bar@<sha> # v1.2.3` gets both the SHA and the comment
  # rewritten. This is what makes SHA-pinning maintainable rather than a
  # one-time snapshot that rots.
  #
  # aquasecurity/trivy-action matches no pattern below, so it is never grouped.
  # That is deliberate: it has a history of tag force-pushing, and a bump to it
  # should never be reviewable only as one line inside a bundle.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Docker's build actions almost always want bumping together.
      docker-actions:
        patterns:
          - "docker/*"
        update-types:
          - "minor"
          - "patch"
      # actions/download-artifact is load-bearing here: it carries image
      # digests between jobs. A major bump to it needs to land on its own,
      # not buried in a group with four other actions.
      actions-toolkit:
        patterns:
          - "actions/*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # npm / pnpm
  # ---------------------------------------------------------------------------
  # pnpm uses the "npm" ecosystem value. Dependabot resolves pnpm-lock.yaml
  # correctly at the pinned pnpm 11 — grouped multi-package updates have landed
  # cleanly, so the old "may error until Dependabot catches up" caveat is gone.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
      # A major is where a broken or hostile release does the most damage and
      # where community signal takes longest to surface. Patches are the least
      # risky and are often themselves the fix for something.
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    labels:
      - "dependencies"
    groups:
      # One group, deliberately. Named per-vendor groups (next, tailwind,
      # supabase, clerk, types) were tried and never fired once: every
      # minor/patch update landed in this catch-all instead, and every major
      # arrived ungrouped. They described intent the config did not implement,
      # so they are gone. If a vendor ever needs its own PR, give it a group
      # WITH update-types and confirm against a real run that it wins.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

    ignore:
      # @types/node describes the runtime, so it must not float ahead of it.
      # The runtime is Node 24 (Dockerfile, devcontainer feature, CI
      # setup-node, `engines`); typing against a newer lib surface would let
      # tsc accept APIs that do not exist at runtime and fail in production
      # rather than in CI. Raise this ceiling in the same PR that raises the
      # runtime, never on its own.
      - dependency-name: "@types/node"
        versions: [">=25"]

  # ---------------------------------------------------------------------------
  # Dev container
  # ---------------------------------------------------------------------------
  # Keeps the Features in .devcontainer/devcontainer.json current. The Node
  # major is pinned deliberately to match the Dockerfile, so only the feature
  # itself moves here.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "devcontainer"
    labels:
      - "dependencies"

  # ---------------------------------------------------------------------------
  # Docker
  # ---------------------------------------------------------------------------
  # Watches the node:24-alpine base image in the Dockerfile. Node 20 going EOL
  # under you is exactly the class of drift this catches.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
    # Stay on the 24.x line; major Node bumps are a deliberate decision made
    # together with the devcontainer, CI, `engines`, and the @types/node
    # ceiling above — not an automated PR.
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
