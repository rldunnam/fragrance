# Fly.io production config. Deployed only by the deploy-production job in
# .github/workflows/deploy.yml, on a manual run with "release" ticked. Fly never
# builds: it runs the GHCR image CI already scanned and smoke-tested, by digest.
#
# Sized to cost as little as possible: one shared-cpu-1x machine in one region,
# suspended when idle (min_machines_running = 0) and resumed on the next request.
# Keep the app on a shared IPv4 address; a dedicated one is billed monthly.

app = 'fragrance'
primary_region = 'ord'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '10s'
    interval = '60s'
    method = 'GET'
    path = '/'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
